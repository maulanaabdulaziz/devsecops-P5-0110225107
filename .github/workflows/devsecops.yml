name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Compile source files
        run: python -m compileall -q main.py tabungan.py validasi.py penyimpanan.py laporan.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  sast-scan:
    name: SAST and Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SAST tool
        run: python -m pip install --upgrade pip bandit
      - name: Run Bandit SAST and enforce Quality Gate
        run: bandit -r . -x ./tests -ll -ii
